<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1ff"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)"/>

  <!-- Soft glow circle -->
  <circle cx="256" cy="240" r="140" fill="#a855f7" opacity="0.15"/>

  <!-- Play triangle -->
  <path d="M200 170 L200 310 L330 240 Z" fill="url(#play)" filter="url(#glow)" opacity="0.95"/>

  <!-- Media wave / signal bars -->
  <g opacity="0.9">
    <path d="M140 320 Q200 280 280 300 T420 290" stroke="url(#wave)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M160 350 Q220 320 300 335 T400 325" stroke="#c084fc" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Signal bars on right -->
  <g fill="#e9d5ff" opacity="0.85">
    <rect x="360" y="280" width="18" height="40" rx="5"/>
    <rect x="388" y="255" width="18" height="65" rx="5"/>
    <rect x="416" y="230" width="18" height="90" rx="5"/>
  </g>

  <!-- Free tag / bookmark -->
  <path d="M400 70 L400 130 L428 112 L456 130 L456 70 Z" fill="#c084fc" opacity="0.95"/>
  <circle cx="428" cy="95" r="8" fill="#f5e1ff"/>
</svg>