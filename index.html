<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FreeWave — Free Media & TV</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#1a0a3c" />
  <meta name="description" content="Discover and play free legal music, movies, TV, podcasts and audiobooks." />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="logo-area">
        <img src="icon.svg" alt="FreeWave" class="logo-icon" />
        <div class="logo-text">
          <span class="logo-name">FreeWave</span>
          <span class="logo-tag">Free Media & TV</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-category="all">
          <span class="nav-icon">✦</span> All
        </button>
        <button class="nav-item" data-category="playable">
          <span class="nav-icon">▶</span> Play Now
        </button>
        <button class="nav-item" data-category="freetv">
          <span class="nav-icon">📺</span> Free TV
        </button>
        <button class="nav-item" data-category="movies">
          <span class="nav-icon">🎬</span> Movies
        </button>
        <button class="nav-item" data-category="music">
          <span class="nav-icon">🎵</span> Music
        </button>
        <button class="nav-item" data-category="audiobooks">
          <span class="nav-icon">📖</span> Audiobooks
        </button>
        <button class="nav-item" data-category="podcasts">
          <span class="nav-icon">🎙</span> Podcasts
        </button>
        <button class="nav-item" data-category="images">
          <span class="nav-icon">🖼</span> Images
        </button>
        <button class="nav-item" data-category="favourites">
          <span class="nav-icon">♥</span> Favourites
        </button>
      </nav>

      <div class="sidebar-footer">
        <p>Legal free sources only</p>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
        <div class="search-wrap">
          <input type="search" id="searchInput" placeholder="Search free media..." autocomplete="off" />
          <button id="searchClear" class="search-clear" aria-label="Clear">×</button>
        </div>
      </header>

      <section class="hero" id="hero">
        <h1>Free media. Actually playable.</h1>
        <p>Use the <strong>Play Now</strong> tab for content that plays inside the app. Free TV services open in browser (they block embedding).</p>
      </section>

      <section class="content">
        <div class="section-header">
          <h2 id="sectionTitle">All Free Media</h2>
          <span id="resultCount" class="result-count"></span>
        </div>

        <div class="grid" id="mediaGrid"></div>

        <div class="empty-state" id="emptyState" hidden>
          <p>No results found</p>
          <button id="resetSearch">Show all</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Bottom Player -->
  <div class="player" id="player" hidden>
    <div class="player-info">
      <div class="player-icon" id="playerIcon">▶</div>
      <div class="player-meta">
        <div class="player-title" id="playerTitle">Nothing playing</div>
        <div class="player-source" id="playerSource"></div>
      </div>
    </div>
    <div class="player-controls">
      <button id="playPauseBtn" class="player-btn" title="Play/Pause">▶</button>
      <button id="stopBtn" class="player-btn" title="Stop">■</button>
    </div>
    <audio id="audioEl" preload="metadata"></audio>
  </div>

  <!-- Video Modal -->
  <div class="modal" id="videoModal" hidden>
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content">
      <button class="modal-close" id="modalClose">×</button>
      <div class="modal-title" id="modalTitle"></div>
      <div class="video-wrap">
        <iframe id="videoFrame" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
