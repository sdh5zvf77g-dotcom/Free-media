<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FreeTV — Legal Free Channels</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Legal free live TV channels and free streaming services from around the world." />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="logo-area">
        <div class="logo-mark">▶</div>
        <div class="logo-text">
          <span class="logo-name">FreeTV</span>
          <span class="logo-tag">Legal Free Channels</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-cat="all">All</button>
        <button class="nav-item" data-cat="news">News</button>
        <button class="nav-item" data-cat="services">Free Services</button>
        <button class="nav-item" data-cat="entertainment">Entertainment</button>
        <button class="nav-item" data-cat="movies">Movies</button>
        <button class="nav-item" data-cat="kids">Kids</button>
        <button class="nav-item" data-cat="favourites">Favourites</button>
      </nav>

      <div class="sidebar-note">
        <p>Only free legal sources.<br>No unauthorized streams.</p>
        <p class="count-note">~400–700 free channels via the major services (location dependent)</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div class="search-wrap">
          <input type="search" id="search" placeholder="Search free channels & services..." />
        </div>
      </header>

      <section class="hero">
        <h1>Free legal TV from around the world</h1>
        <p>Official free services + free news streams. No VPN tricks, no pirated channels.</p>
      </section>

      <section class="content">
        <div class="section-header">
          <h2 id="title">All Sources</h2>
          <span id="count" class="count"></span>
        </div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" hidden>
          <p>No matches</p>
          <button id="reset">Show all</button>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
